[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-aware-st"
version = "0.1.0"
description = "Reproducibility utilities for scale-aware spatial transcriptomics analyses"
requires-python = ">=3.10,<3.11"
dependencies = [
  "anndata==0.10.7",
  "dask==2024.5.1",
  "dask-image==2024.5.3",
  "distributed==2024.5.1",
  "h5py==3.11.0",
  "ipykernel==6.28.0",
  "matplotlib==3.9.0",
  "matplotlib-scalebar==0.8.1",
  "mygene==3.2.2",
  "numpy==1.26.4",
  "numcodecs==0.12.1",
  "ome-zarr==0.9.0",
  "openpyxl==3.1.4",
  "pandas==2.2.2",
  "pyreadr==0.5.6",
  "scanpy==1.10.1",
  "scikit-image==0.23.2",
  "scikit-learn==1.5.0",
  "scipy==1.13.1",
  "seaborn==0.13.2",
  "setuptools==80.9.0",
  "spatialdata==0.0.15",
  "squidpy @ git+https://github.com/scverse/squidpy@df8e042264a99e489573273e449d585e3ff6143c",
  "statsmodels==0.14.2",
  "venn==0.1.3",
  "xarray==2023.12.0",
  "xarray-datatree==0.0.14",
  "xarray-schema==0.0.3",
  "zarr==2.18.1",
]

[project.optional-dependencies]
scrublet = [
  "annoy==1.17.3",
  "scrublet==0.2.3",
]
test = [
  "pytest==8.2.1",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["scale_aware_st*", "kimlabspatial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
